name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  terraform:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    # Optional: link to GitHub Environment (create in repo settings)
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Show selected environment
        run: echo "Deploying to ${{ github.event.inputs.environment }}"
        
      - name: Terraform Init
        run: terraform init
        working-directory: terraform/${{ github.event.inputs.environment }}
        
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/${{ github.event.inputs.environment }}
        
      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform/${{ github.event.inputs.environment }}
        
      # Terraform Apply for dev/uat (auto-approve)
      - name: Terraform Apply (dev/uat)
        if: github.event.inputs.environment != 'prod'
        run: terraform apply -auto-approve
        working-directory: terraform/${{ github.event.inputs.environment }}
        
      # Terraform Apply for prod (manual approval via GitHub Environment)
      - name: Terraform Apply (prod)
        if: github.event.inputs.environment == 'prod'
        run: terraform apply
        working-directory: terraform/prod
        
