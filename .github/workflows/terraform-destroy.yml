name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    # 🔐 Environment protection (important for prod)
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Show environment
        run: echo "Destroying ${{ github.event.inputs.environment }} environment"

      # ---------------- INIT ----------------
      - name: Terraform Init
        run: terraform init
        working-directory: terraform/${{ github.event.inputs.environment }}

      # ---------------- PLAN DESTROY ----------------
      - name: Terraform Plan Destroy
        run: terraform plan -destroy -out=tfplan
        working-directory: terraform/${{ github.event.inputs.environment }}

      # 👉 Show what will be deleted
      - name: Show Destroy Plan
        run: terraform show tfplan
        working-directory: terraform/${{ github.event.inputs.environment }}

      # ---------------- DESTROY ----------------
      - name: Terraform Destroy Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform/${{ github.event.inputs.environment }}
